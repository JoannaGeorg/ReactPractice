<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react_basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.querySelector('.js-container'));
      
      function ChatInput() {
        return (
          <>
            <input 
              placeholder='Send a message to Chatbot.' 
              size='30' 
            />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        // const { message, sender } = props;
        const img_link = 'images/' + sender + '.png';

        // if (sender === 'robot') {
        //   return (
        //     <div>
        //       <img src={img_link} width='50' />
        //       {message}
        //     </div>
        //   );
        // }

        return (
          <div>
            {sender === 'robot' && <img src={img_link} width='50' />}
            {message}
            {sender === 'user' && <img src={img_link} width='50' />}
          </div>
        );
      }

      function App() {
        const chatMessages = [
          {
            message: 'hello chatbot!',
            sender: 'user'
          },
          {
            message: 'Hello, how can I help you?',
            sender: 'robot'
          },
          {
            message: 'What is the date today?',
            sender: 'user'
          },
          {
            message: 'August 21.',
            sender: 'robot'
          }
        ]

        const chatMessageComponents = chatMessages.map((chatMessage) => {
          return (
            <ChatMessage
              message={chatMessage.message}
              sender={chatMessage.sender}            
            />
          )
        })

        return (
          <>
            <ChatInput />
            {chatMessageComponents}
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
