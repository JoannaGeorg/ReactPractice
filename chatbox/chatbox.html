<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react_basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.querySelector('.js-container'));

      function ChatInput() {
        function saveInputText() {
         console.log(event.target.value);
        }
        return (
          <>
            <input 
              placeholder='Send a message to Chatbot.' 
              size='30' 
              onChange={saveInputText}
            />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        // const { message, sender } = props;
        const img_link = 'images/' + sender + '.png';

        return (
          <div>
            {sender === 'robot' && <img src={img_link} width='50' />}
            {message}
            {sender === 'user' && <img src={img_link} width='50' />}
          </div>
        );
      }

      function ChatMessages() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: 'hello chatbot!',
            sender: 'user',
            id: 'id1'
          },
          {
            message: 'Hello, how can I help you?',
            sender: 'robot',
            id: 'id2'
          },
          {
            message: 'What is the date today?',
            sender: 'user',
            id: 'id3'
          },
          {
            message: 'August 21.',
            sender: 'robot',
            id: 'id4'
          }
        ])

        // const chatMessages = array[0];
        // const setChatMessages = array[1];

        function sendMessage() {
            setChatMessages([
              ...chatMessages,
              {
                message: 'test',
                sender: 'user',
                id: crypto.randomUUID()
              }
            ]);
        }

        return (
          <>
            <button onClick={sendMessage} >Send Message</button>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}    
                  key={chatMessage.id}        
                />
              )
            })}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        )
      }

      root.render(<App />);
    </script>
  </body>
</html>
